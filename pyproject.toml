[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capacity"
version = "0.3.0"
description = "Stateless trace compiler for Google Cloud Provisioned Throughput and vLLM: sub-second burndown gateways, $0 night backfill, and FOCUS 1.2 two-pool chargeback."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "google-cloud-monitoring>=2.22",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ast-grep-cli>=0.35",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[project.scripts]
capacity = "capacity.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "BLE", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "ANN", "E501"]
"**/benchmarks/**/*.py" = ["S311"]
# LiteLLM hands its hooks untyped objects, so the generated callback takes `Any`.
"**/capacity/litellm_burndown_callback.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "port: Hexagonal port parity tests between LocalTraceAdapter and CloudMonitoringAdapter",
]
