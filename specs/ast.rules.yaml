# Declarative Structural & Security AST Contract (ast-grep)
# Every module in capacity/ is pure sizing/FinOps maths unless it is one of the adapters ignored
# below, so a new module is covered without editing this file. tests/test_isolation_guard.py
# holds the same rule in Python; tests/test_repo_hygiene.py runs every example listed here.

id: library-never-imports-examples
language: Python
severity: error
message: "Hexagonal violation: capacity/ engine must never import examples/ or benchmarks/."
files:
  - "capacity/**/*.py"
metadata:
  test_path: "capacity/probe.py"
  invalid_examples:
    - "import examples"
    - "from examples.demo_profile import load"
    - "import benchmarks"
  valid_examples:
    - "from capacity.models import ModelRecommendation"
rule:
  any:
    - kind: import_statement
      regex: "^import\\s+(examples|benchmarks)(\\b|\\.)"
    - kind: import_from_statement
      regex: "^from\\s+(examples|benchmarks)(\\b|\\.)"
---
id: core-math-never-imports-driving-ports
language: Python
severity: error
message: "Hexagonal violation: only api.py, cli.py and cli_formatters.py may import FastAPI, Typer or Uvicorn."
files:
  - "capacity/**/*.py"
ignores:
  - "capacity/api.py"
  - "capacity/cli.py"
  - "capacity/cli_formatters.py"
metadata:
  test_path: "capacity/finops.py"
  invalid_examples:
    - "import fastapi"
    - "from typer import Typer"
    - "import uvicorn"
  valid_examples:
    - "from capacity.models import FocusChargebackReport"
rule:
  any:
    - kind: import_statement
      regex: "^import\\s+(fastapi|typer|uvicorn)(\\b|\\.)"
    - kind: import_from_statement
      regex: "^from\\s+(fastapi|typer|uvicorn)(\\b|\\.)"
---
id: domain-math-never-imports-gcp-adapter
language: Python
severity: error
message: "Hexagonal violation: pure modules never import google.cloud or the capacity adapters (core, api, cli)."
files:
  - "capacity/**/*.py"
ignores:
  - "capacity/api.py"
  - "capacity/cli.py"
  - "capacity/cli_formatters.py"
  - "capacity/core.py"
metadata:
  test_path: "capacity/capacity.py"
  invalid_examples:
    - "from google.cloud import monitoring_v3"
    - "from google import cloud"
    - "from capacity.core import fetch_throughput"
    - "import capacity.core"
    - "from capacity import core"
    - "from capacity import finops, core"
    - "from . import core"
    - "from .core import fetch_throughput"
    - "from capacity import api"
  valid_examples:
    - "from capacity.forecasting import holts_linear_trend"
    - "from capacity import finops"
    - "from capacity.coreutils import helper"
rule:
  any:
    - kind: import_statement
      regex: "^import\\s+(google\\.cloud|capacity\\.(core|api|cli|cli_formatters))(\\b|\\.)"
    - kind: import_from_statement
      regex: "^from\\s+(google\\.cloud|(capacity)?\\.(core|api|cli|cli_formatters))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(capacity|\\.)\\s+import\\s+(.*[\\s,(])?(core|api|cli|cli_formatters)\\b"
    - kind: import_from_statement
      regex: "(?s)^from\\s+google\\s+import\\s+(.*[\\s,(])?cloud\\b"
---
id: no-subprocess-shell-true
language: Python
severity: error
message: "Security violation: subprocess with shell=True or os.system() is forbidden."
ignores:
  - "tests/**"
metadata:
  test_path: "capacity/proc_probe.py"
  invalid_examples:
    - "subprocess.run(cmd, shell=True)"
    - "subprocess.Popen(cmd, shell=True, text=True)"
    - "os.system(cmd)"
  valid_examples:
    - 'subprocess.run(["gcloud", "version"], check=True)'
rule:
  any:
    - pattern: subprocess.$FN($$$, shell=True)
    - pattern: subprocess.$FN($$$, shell=True, $$$)
    - pattern: subprocess.$FN(shell=True)
    - pattern: subprocess.$FN(shell=True, $$$)
    - pattern: os.system($$$)
---
id: no-eval-builtin
language: Python
severity: error
message: "Security violation: eval() is forbidden in capacity modules."
files:
  - "capacity/**/*.py"
metadata:
  test_path: "capacity/eval_probe.py"
  invalid_examples:
    - "eval(expr)"
  valid_examples:
    - "float(raw_value)"
rule:
  pattern: eval($$$)
