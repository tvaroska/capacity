# Declarative Structural & Security AST Contract (ast-grep)
# States one import rule per folder across Ports, Adapters and Contracts (`ADR-005` / `P2.3`):
# 1. `engine/` imports only `capacity.contract` (and stdlib / sibling `capacity.engine`).
# 2. Only `capacity/telemetry/cloud_monitoring.py` imports `google.*` Cloud SDKs; only `cli/` and
#    `api.py` import `cloud_monitoring`.
# 3. `showcase/` renderer modules import no calculation (`engine`, `ingest`, `telemetry`,
#    `gateway`, `showcase.evaluate`, `showcase.sample_data`).
# 4. Only `capacity/cli/**` and `capacity/api.py` import driving ports (`fastapi`, `typer`,
#    `uvicorn`, `dotenv`).
# `tests/test_isolation_guard.py` enforces the full resolved-import folder table in Python, and
# `tests/test_repo_hygiene.py` executes every `invalid_examples` / `valid_examples` entry here.

id: library-never-imports-examples
language: Python
severity: error
message: "Boundary violation: capacity/ modules must never import examples/, benchmarks/, or dynamic imports."
files:
  - "capacity/**/*.py"
metadata:
  test_path: "capacity/engine/probe.py"
  invalid_examples:
    - "import examples"
    - "import math, examples"
    - "from examples.demo_profile import load"
    - "import benchmarks"
    - "import os, benchmarks.trace_backtest"
    - "from benchmarks import trace_backtest"
    - "__import__('capacity.api')"
    - "importlib.import_module('capacity.api')"
  valid_examples:
    - "from capacity.contract.results import ModelRecommendation"
    - "import examples_helper"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(examples|benchmarks)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(examples|benchmarks)(\\b|\\.)"
    - pattern: __import__($$$)
    - pattern: importlib.import_module($$$)
    - pattern: import_module($$$)
---
id: engine-imports-only-contract
language: Python
severity: error
message: "Folder rule (engine/): capacity/engine/ may import only stdlib, capacity.contract, and capacity.engine."
files:
  - "capacity/engine/**/*.py"
metadata:
  test_path: "capacity/engine/probe.py"
  invalid_examples:
    - "from capacity.ingest.prometheus import parse_prometheus_metrics"
    - "from capacity.telemetry.port import TelemetryPort"
    - "from capacity.gateway.bundle import generate_gateway_bundle"
    - "from capacity.showcase.sample_data import DEMO_OPTIMIZE_SERIES"
    - "from capacity.cli.common import app"
    - "import capacity.api"
    - "from ..telemetry import port"
    - "from .. import gateway"
    - "import yaml"
    - "from pydantic import BaseModel"
  valid_examples:
    - "from capacity.contract.requests import OptimizeRequest"
    - "from capacity.contract.results import OptimizeResponse"
    - "from capacity.engine.catalog import build_model_catalog"
    - "from .stats import percentile"
    - "import math"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(pydantic|yaml|fastapi|typer|uvicorn|dotenv|google|capacity\\.(ingest|telemetry|gateway|showcase|cli|api))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(pydantic|yaml|fastapi|typer|uvicorn|dotenv|google|(capacity\\.|\\.\\.\\s*)(ingest|telemetry|gateway|showcase|cli|api))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(capacity|\\.\\.)\\s+import\\s+(.*[\\s,(])?(ingest|telemetry|gateway|showcase|cli|api)\\b"
---
id: only-cloud-monitoring-imports-gcp-sdk
language: Python
severity: error
message: "Folder rule (telemetry/): only capacity/telemetry/cloud_monitoring.py may import Google Cloud SDKs."
files:
  - "capacity/**/*.py"
ignores:
  - "capacity/telemetry/cloud_monitoring.py"
metadata:
  test_path: "capacity/telemetry/probe.py"
  invalid_examples:
    - "from google.cloud import monitoring_v3"
    - "from google import cloud"
    - "from google.auth.exceptions import DefaultCredentialsError"
    - "from google.api_core.exceptions import PermissionDenied"
    - "from google.protobuf import duration_pb2"
    - "import google.auth"
  valid_examples:
    - "from capacity.telemetry.port import TelemetryPort"
    - "from capacity.contract.common import SeriesKey"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*google\\.(cloud|auth|api_core|protobuf)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+google\\.(cloud|auth|api_core|protobuf)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+google\\s+import\\s+(.*[\\s,(])?(cloud|auth|api_core|protobuf)\\b"
---
id: renderer-imports-no-calculation
language: Python
severity: error
message: "Folder rule (showcase renderer): page renderer modules may import only stdlib, capacity.contract, and sibling renderer modules."
files:
  - "capacity/showcase/**/*.py"
ignores:
  - "capacity/showcase/__init__.py"
  - "capacity/showcase/evaluate.py"
  - "capacity/showcase/sample_data.py"
metadata:
  test_path: "capacity/showcase/renderer_probe.py"
  invalid_examples:
    - "from capacity.engine.catalog import build_model_catalog"
    - "from capacity.engine.burst import evaluate_micro_burst_window"
    - "from capacity.gateway.bundle import generate_gateway_bundle"
    - "from capacity.showcase.evaluate import evaluate_showcase_scenario"
    - "from capacity.showcase.sample_data import build_default_showcase_scenario"
    - "from .evaluate import evaluate_showcase_scenario"
    - "from . import evaluate"
    - "from ..engine import sizing"
  valid_examples:
    - "from capacity.contract.scenario import ShowcaseReport"
    - "from capacity.showcase.view import PageView"
    - "import html"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*capacity\\.(engine|ingest|telemetry|gateway|cli|api|showcase\\.(evaluate|sample_data))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+((capacity\\.|\\.\\.\\s*)(engine|ingest|telemetry|gateway|cli|api)|(capacity\\.showcase\\.|\\.\\s*)(evaluate|sample_data))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(capacity\\.showcase|\\.)\\s+import\\s+(.*[\\s,(])?(evaluate|sample_data)\\b"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(capacity|\\.\\.)\\s+import\\s+(.*[\\s,(])?(engine|ingest|telemetry|gateway|cli|api)\\b"
---
id: only-cli-and-api-import-driving-ports
language: Python
severity: error
message: "Folder rule (cli/ & api.py): only capacity/cli/** and capacity/api.py may import FastAPI, Typer, Uvicorn, dotenv, or cloud_monitoring."
files:
  - "capacity/**/*.py"
ignores:
  - "capacity/api.py"
  - "capacity/cli/**"
metadata:
  test_path: "capacity/ingest/probe.py"
  invalid_examples:
    - "import fastapi"
    - "import math, fastapi"
    - "from typer import Typer"
    - "import uvicorn"
    - "from dotenv import load_dotenv"
    - "from capacity import api"
    - "from capacity.cli import app"
    - "import capacity.telemetry.cloud_monitoring"
    - "from capacity.telemetry import cloud_monitoring"
    - "from ..telemetry import cloud_monitoring"
  valid_examples:
    - "from capacity.contract.results import FocusChargebackReport"
    - "from capacity.telemetry import port"
    - "import fastapi_like_helper"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(fastapi|typer|uvicorn|dotenv|capacity\\.(api|cli|telemetry\\.cloud_monitoring))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(fastapi|typer|uvicorn|dotenv|(capacity\\.|\\.+\\s*)(api|cli|(telemetry\\.)?cloud_monitoring))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(capacity|\\.+)+\\s+import\\s+(.*[\\s,(])?(api|cli)\\b"
    - kind: import_from_statement
      regex: "(?s)^from\\s+((capacity\\.|\\.+\\s*)telemetry|\\.+)+\\s+import\\s+(.*[\\s,(])?cloud_monitoring\\b"
---
id: no-subprocess-shell-true
language: Python
severity: error
message: "Security violation: subprocess with shell=True or os.system() is forbidden."
ignores:
  - "tests/**"
metadata:
  test_path: "capacity/proc_probe.py"
  invalid_examples:
    - "subprocess.run(cmd, shell=True)"
    - "subprocess.Popen(cmd, shell=True, text=True)"
    - "os.system(cmd)"
  valid_examples:
    - 'subprocess.run(["gcloud", "version"], check=True)'
rule:
  any:
    - pattern: subprocess.$FN($$$, shell=True)
    - pattern: subprocess.$FN($$$, shell=True, $$$)
    - pattern: subprocess.$FN(shell=True)
    - pattern: subprocess.$FN(shell=True, $$$)
    - pattern: os.system($$$)
---
id: no-eval-builtin
language: Python
severity: error
message: "Security violation: eval() is forbidden in capacity modules."
files:
  - "capacity/**/*.py"
metadata:
  test_path: "capacity/eval_probe.py"
  invalid_examples:
    - "eval(expr)"
  valid_examples:
    - "float(raw_value)"
rule:
  pattern: eval($$$)
