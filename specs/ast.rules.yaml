# Declarative Structural & Security AST Contract (ast-grep)
# Every module under capacity/ (including sub-folders) is pure sizing/FinOps maths unless it is a
# listed driving/cloud adapter below. tests/test_isolation_guard.py holds the twin AST classifier
# in Python, and tests/test_repo_hygiene.py executes every invalid/valid example listed here.

id: library-never-imports-examples
language: Python
severity: error
message: "Hexagonal violation: capacity/ modules must never import examples/ or benchmarks/."
files:
  - "capacity/**/*.py"
metadata:
  test_path: "capacity/engine/probe.py"
  invalid_examples:
    - "import examples"
    - "import math, examples"
    - "from examples.demo_profile import load"
    - "import benchmarks"
    - "import os, benchmarks.trace_backtest"
    - "from benchmarks import trace_backtest"
  valid_examples:
    - "from capacity.models import ModelRecommendation"
    - "import examples_helper"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(examples|benchmarks)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(examples|benchmarks)(\\b|\\.)"
---
id: core-math-never-imports-driving-ports
language: Python
severity: error
message: "Hexagonal violation: only api.py and CLI modules may import FastAPI, Typer or Uvicorn."
files:
  - "capacity/**/*.py"
ignores:
  - "capacity/api.py"
  - "capacity/cli.py"
  - "capacity/cli_formatters.py"
  - "capacity/cli/**"
metadata:
  test_path: "capacity/engine/finops.py"
  invalid_examples:
    - "import fastapi"
    - "import math, fastapi"
    - "from typer import Typer"
    - "import uvicorn"
    - "from fastapi.responses import JSONResponse"
  valid_examples:
    - "from capacity.models import FocusChargebackReport"
    - "import fastapi_like_helper"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(fastapi|typer|uvicorn)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(fastapi|typer|uvicorn)(\\b|\\.)"
---
id: domain-math-never-imports-gcp-adapter
language: Python
severity: error
message: "Hexagonal violation: pure modules never import Google Cloud SDKs, driving/cloud adapters, or dynamic imports."
files:
  - "capacity/**/*.py"
ignores:
  - "capacity/api.py"
  - "capacity/cli.py"
  - "capacity/cli_formatters.py"
  - "capacity/core.py"
  - "capacity/cli/**"
  - "capacity/telemetry/cloud_monitoring.py"
metadata:
  test_path: "capacity/engine/probe.py"
  invalid_examples:
    - "from google.cloud import monitoring_v3"
    - "from google import cloud"
    - "from google.auth.exceptions import DefaultCredentialsError"
    - "from google.api_core.exceptions import PermissionDenied"
    - "from capacity.core import fetch_throughput"
    - "import capacity.core"
    - "import math, capacity.core"
    - "from capacity import core"
    - "from capacity import finops, core"
    - "from . import core"
    - "from .. import core"
    - "from ... import core"
    - "from .. import (\n    finops,\n    core,\n)"
    - "from .core import fetch_throughput"
    - "from ..core import fetch_throughput"
    - "from ...core import fetch_throughput"
    - "from capacity import api"
    - "import capacity.telemetry.cloud_monitoring"
    - "from capacity.telemetry import cloud_monitoring"
    - "from capacity.telemetry.cloud_monitoring import CloudMonitoringAdapter"
    - "from ..telemetry import cloud_monitoring"
    - "from ..telemetry.cloud_monitoring import CloudMonitoringAdapter"
    - "__import__('capacity.core')"
    - "importlib.import_module('capacity.core')"
  valid_examples:
    - "from capacity.forecasting import holts_linear_trend"
    - "from capacity import finops"
    - "from . import burst"
    - "from .. import finops"
    - "from capacity.coreutils import helper"
    - "from ..coreutils import helper"
    - "from capacity.telemetry import port"
    - "from ..telemetry import port"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(google\\.(cloud|auth|api_core)|capacity\\.(core|api|cli|cli_formatters|telemetry\\.cloud_monitoring))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(google\\.(cloud|auth|api_core)|(capacity\\.|\\.+\\s*)(core|api|cli|cli_formatters|(telemetry\\.)?cloud_monitoring))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(capacity|\\.+)+\\s+import\\s+(.*[\\s,(])?(core|api|cli|cli_formatters)\\b"
    - kind: import_from_statement
      regex: "(?s)^from\\s+((capacity\\.|\\.+\\s*)telemetry|\\.+)+\\s+import\\s+(.*[\\s,(])?cloud_monitoring\\b"
    - kind: import_from_statement
      regex: "(?s)^from\\s+google\\s+import\\s+(.*[\\s,(])?(cloud|auth|api_core)\\b"
    - pattern: __import__($$$)
    - pattern: importlib.import_module($$$)
    - pattern: import_module($$$)
---
id: no-subprocess-shell-true
language: Python
severity: error
message: "Security violation: subprocess with shell=True or os.system() is forbidden."
ignores:
  - "tests/**"
metadata:
  test_path: "capacity/proc_probe.py"
  invalid_examples:
    - "subprocess.run(cmd, shell=True)"
    - "subprocess.Popen(cmd, shell=True, text=True)"
    - "os.system(cmd)"
  valid_examples:
    - 'subprocess.run(["gcloud", "version"], check=True)'
rule:
  any:
    - pattern: subprocess.$FN($$$, shell=True)
    - pattern: subprocess.$FN($$$, shell=True, $$$)
    - pattern: subprocess.$FN(shell=True)
    - pattern: subprocess.$FN(shell=True, $$$)
    - pattern: os.system($$$)
---
id: no-eval-builtin
language: Python
severity: error
message: "Security violation: eval() is forbidden in capacity modules."
files:
  - "capacity/**/*.py"
metadata:
  test_path: "capacity/eval_probe.py"
  invalid_examples:
    - "eval(expr)"
  valid_examples:
    - "float(raw_value)"
rule:
  pattern: eval($$$)
